# Left (central) screen. ZMK applies this after lily58.conf, for the left half only.

# Typing speed: speedometer, graph and number. The speedometer only shows
# when neither Luna nor Bongo Cat is on, so both pets stay off.
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n

# No held-modifier icons, Caps Lock animation, or layer name.
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_LAYER=n
